spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:apm_demo}
    username: ${MYSQL_USER:apm}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:18080}

app:
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:18081}
    # 읽기 타임아웃은 apm-payment 의 지연 주입(기본 500ms)보다 넉넉히 잡는다
    connect-timeout-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
